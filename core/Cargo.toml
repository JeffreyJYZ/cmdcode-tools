[package]
name = "cmduse-core"
version = "2.0.0"
edition = "2021"
description = "Pure logic library for the cmduse CLI (cmd-usage): plan table, date/ISO helpers, window math, usage aggregation, formatting. Independently versioned on its own 2.x line."
license = "MIT"
repository = "https://github.com/JeffreyJYZ/cmdcode-tools"

[dependencies]
serde = { version = "1", features = ["derive"] }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
serde_json = "1"
