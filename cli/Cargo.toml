[package]
name = "cmd-usage"
version = "0.7.3"
edition = "2021"
# Two bins (`cmduse` + the `cmdusedev` twin), so `cargo run -p cmd-usage` needs
# an explicit default: CI's `-V` smoke test, and humans typing it.
default-run = "cmduse"
description = "Live Command Code (commandcode.ai) usage dashboard: credits, 5-hour and weekly windows, plan limits. Watch mode or one-shot."
license = "MIT"
repository = "https://github.com/JeffreyJYZ/command-code-zed"
keywords = ["cli", "dashboard", "usage", "command-code", "tui"]
categories = ["command-line-utilities"]
readme = "README.md"

[[bin]]
name = "cmduse"
path = "src/main.rs"

# Dev twin: same code, different name, so a local build never shadows the
# installed `cmduse` (and consumers can target it via CMDUSE_BIN).
[[bin]]
name = "cmdusedev"
path = "src/bin/cmdusedev.rs"

# OpenCode Go/Zen twin: same CLI shape as cmduse, but its data is local
# (opencode.db) plus the docs catalogue in core/zen.json — OpenCode publishes no
# usage API (the one route, /zen/go/v1/usage, is entitlement-gated).
[[bin]]
name = "ocuse"
path = "src/bin/ocuse.rs"

[dependencies]
cmduse-core = { path = "../core", version = "1" }
ureq = { version = "2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lexopt = "0.3"
# ocuse reads opencode's own SQLite store read-only; bundled so the crate needs
# no system libsqlite.
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
