name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo run -p cmd-usage -- -V          # binary smoke-test
      - run: cargo package -p cmduse-core --allow-dirty  # crate packages + verifies
      # Verifies the CLI tarball too. It resolves `cmduse-core` from the REGISTRY,
      # so a core API change fails here until core is published — which is the
      # release order (core first), not a false alarm.
      - run: cargo package -p cmd-usage

  typescript:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: opencode-plugin
            build: true
          - package: oc-cmd-compare
          - package: reqshape
          - package: opencode-context
            build: true
          - package: opencode-shell-rc
            build: true
          - package: opencode-session-dir
            build: true
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun check
      # Read-only, so a formatting or lint deviation fails the build instead of
      # being written away: `bun fmt`/`bun lint` are the local writing pass.
      - run: bunx biome check
      - if: matrix.build
        run: bun run build

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build      # build before check: next-env.d.ts imports the generated, gitignored .next/types
      - run: bun check
      - run: bunx biome check
      - run: bun test
      - run: bun check:links
