name: Release

# Tag-driven binary releases: `cmduse-vX.Y.Z` builds all six targets, packages
# them as cmduse-<version>-<target>.tar.gz, and publishes them to a GitHub
# Release. The names are a public contract — the Homebrew formula's urls and
# cli/Cargo.toml's [package.metadata.binstall] both template them, so changing
# the pattern breaks brew and `cargo binstall` users.
on:
  push:
    tags: ["cmduse-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # musl targets cross-link through zig; the gnu/darwin builds are native.
      - if: contains(matrix.target, 'musl')
        uses: goto-bus-stop/setup-zig@v2
      - if: contains(matrix.target, 'musl')
        run: cargo install cargo-zigbuild --locked
      - name: Build (musl)
        if: contains(matrix.target, 'musl')
        run: cargo zigbuild --locked --release --target ${{ matrix.target }} -p cmd-usage
      - name: Build (native)
        if: ${{ !contains(matrix.target, 'musl') }}
        run: cargo build --locked --release --target ${{ matrix.target }} -p cmd-usage
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/cmduse
            target/${{ matrix.target }}/release/ocuse
            target/${{ matrix.target }}/release/cmdusedev

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/cmduse-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#cmduse-v}"
          mkdir -p out
          for dir in artifacts/*; do
            target="$(basename "$dir")"
            stage="cmduse-${version}-${target}"
            mkdir -p "stage/${stage}"
            install -m 0755 "${dir}/cmduse" "${dir}/ocuse" "${dir}/cmdusedev" "stage/${stage}/"
            install -m 0644 cli/cmduse.1 cli/LICENSE-MIT "stage/${stage}/"
            # Deterministic archive, flattened: binaries at the archive root so
            # both the Homebrew formula and binstall's bin-dir stay simple.
            tar --sort=name --mtime='UTC 2020-01-01' --owner=0 --group=0 \
              --numeric-owner -C "stage/${stage}" -czf "out/${stage}.tar.gz" .
            rm -rf stage
          done
          (cd out && sha256sum ./*.tar.gz | sed 's|\./||' > SHA256SUMS)
          cat out/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "${GITHUB_REF_NAME}" --generate-notes out/*

  verify:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Re-download and verify every asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # No checkout in this job: -R tells gh which repo, instead of it
          # trying to infer one from a git worktree that isn't here.
          gh release download "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" -D dl
          cd dl
          sha256sum -c SHA256SUMS
          ls -l ./*.tar.gz
