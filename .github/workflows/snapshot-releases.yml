name: Snapshot releases data

# Keeps `website/src/data/releases.json` — the /changelog timeline — fresh
# without a redeploy. The page is static, so the timeline is a committed
# snapshot: this job re-runs the same script a maintainer runs by hand
# (`bun snapshot:releases`) and commits only on material change. It fetches
# public registries only, so unlike the mpc snapshot it needs no cmduse build.
on:
  schedule:
    # 5-minutely, deliberately off the top of the hour: GitHub's scheduler piles
    # up there and drops runs (the mpc snapshot sits off the hour for the same
    # reason). GitHub also delays and coalesces scheduled runs — a 5-min cron is
    # a request, not a guarantee — so the timeline may be hours old, never stale
    # enough to matter, and a release can be snapshotted by hand any time.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time so two crons cannot race the push.
concurrency:
  group: releases-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # Only the canonical repo: a fork's schedule would push into a mirror.
    if: github.repository == 'JeffreyJYZ/cmdcode-tools'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: website
      - run: bun run snapshot:releases
        working-directory: website
      - name: Commit on material change
        run: |
          # `generatedAt` churns every run; ignore it when deciding.
          if git diff --ignore-matching-lines='"generatedAt"' --quiet -- website/src/data/releases.json; then
            echo "no material change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/src/data/releases.json
          git commit -m "chore(data): refresh releases snapshot [skip ci]"
          # The mpc snapshot pushes on its own schedule from another workflow;
          # rebase so a concurrent push is a retry, not a failed run.
          git pull --rebase --autostash
          git push
