name: Snapshot mpc data

# Keeps `website/src/data/mpc.json` fresh without a redeploy. mpc is Bun-only
# (Bun.file/Bun.write/bun:sqlite/Bun.spawn), so it cannot run in a Vercel
# Function; a scheduled CI job is the only place with Bun to run it. The
# /compare page fetches the committed snapshot in the browser.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# One run at a time so two crons cannot race the push.
concurrency:
  group: mpc-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # Only the canonical repo: a fork's schedule would push into a mirror.
    if: github.repository == 'JeffreyJYZ/cmdcode-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # Root install: the workspace, so mpc's `cac` dependency is present.
      - run: bun install
      - run: bun run --cwd website snapshot:mpc
      - name: Commit on material change
        run: |
          # `generatedAt` churns every run, so compare the data with that key
          # removed — a jq-normalised compare, not a line diff, so the gate
          # cannot be silently defeated by how the JSON is formatted (a
          # one-line file would make an ignore-pattern match every hunk).
          new=$(jq -S 'del(.generatedAt)' website/src/data/mpc.json)
          old=$(git show HEAD:website/src/data/mpc.json | jq -S 'del(.generatedAt)')
          if [ "$new" = "$old" ]; then
            echo "no material change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/src/data/mpc.json
          git commit -m "chore(data): refresh mpc snapshot [skip ci]"
          git push
